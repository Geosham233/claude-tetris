<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    (function () {
      var saved = localStorage.getItem('tetris-theme');
      document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <button id="sound-toggle" class="theme-toggle" type="button" aria-label="Silenciar" title="Sonido (M)">🔊</button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" title="Cambiar tema">🌙</button>
    </div>
    <div class="game-container">
      <aside class="panel side">
        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div id="energy-bar" class="energy-bar" role="progressbar" aria-label="Energía" aria-valuemin="0">
            <div id="energy-fill"></div>
          </div>
          <button id="ability-btn" class="overlay-btn ability-btn" type="button" disabled>Habilidad (E)</button>
          <span id="slow-status"></span>
        </div>
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" class="preview-canvas" width="80" height="80"></canvas>
        </div>
        <div class="panel-section hidden" id="peek-section">
          <span class="label">VISIÓN</span>
          <canvas id="peek-canvas" class="preview-canvas" width="72" height="240"></canvas>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section hidden" id="objective">
          <span class="label">OBJETIVO</span>
          <strong id="objective-name"></strong>
          <span id="objective-status"></span>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
          <span class="badge hidden" id="b2b" title="El próximo Tetris puntúa x1.5">B2B</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" class="preview-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> <span id="rotate-label">rotar</span></li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> sonido</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="level-list" class="level-list hidden"></div>
        <div id="ability-list" class="level-list hidden"></div>
        <button id="restart-btn" class="overlay-btn" type="button">Reiniciar</button>
        <button id="menu-btn" class="overlay-btn secondary" type="button">Menú</button>
      </div>
    </div>
  </div>

  <script src="challenges.js"></script>
  <script src="abilities.js"></script>
  <script src="game.js"></script>
</body>
</html>
